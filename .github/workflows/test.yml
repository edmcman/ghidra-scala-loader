name: Test HelloWorldScript

on:
  push:
  pull_request:

env:
  GHIDRA_VERSION: "12.1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download Ghidra ${{ env.GHIDRA_VERSION }}
        uses: robinraju/release-downloader@v1.7
        with:
          repository: "NationalSecurityAgency/ghidra"
          tag: "Ghidra_${{ env.GHIDRA_VERSION }}_build"
          fileName: "ghidra*.zip"
          out-file-path: "ghidra_zip"

      - name: Extract Ghidra
        run: |
          unzip -q ghidra_zip/ghidra*.zip -d ghidra
          echo "GHIDRA_INSTALL_DIR=$(find $PWD/ghidra -maxdepth 1 -type d -name 'ghidra_*')" >> $GITHUB_ENV

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and install extension
        run: ./gradlew install
        env:
          GHIDRA_INSTALL_DIR: ${{ env.GHIDRA_INSTALL_DIR }}

      - name: Run HelloWorldScript via analyzeHeadless
        run: |
          mkdir -p /tmp/ghidra_project
          "$GHIDRA_INSTALL_DIR/support/analyzeHeadless" \
            /tmp/ghidra_project TestProject \
            -import /bin/ls \
            -noanalysis \
            -postScript HelloWorldScript.scala \
            -deleteProject 2>&1 | tee output.log
          grep -q "Hello world, I'm written in Scala 3!" output.log
