name: Release on tag

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Validate project version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Release tags must use vMAJOR.MINOR.PATCH (for example, v1.0.0).'
            exit 1
          fi

  build:
    needs: validate-tag
    uses: ./.github/workflows/build.yml

  publish:
    needs: [validate-tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: extension-*
          path: artifacts
      - name: Stage extensions in draft and publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=(artifacts/extension-*/*.zip)
          test "${#assets[@]}" -gt 0
          source_commit=$(cat artifacts/extension-master/ghidra-source-commit.txt)
          # shellcheck disable=SC2016
          printf 'The upstream master extension was built against Ghidra commit `%s`.\n' "$source_commit" > notes.md
          if gh release view "$RELEASE_TAG" --json body --jq .body > existing-notes.md; then
            python3 - <<'PYNOTES'
          from pathlib import Path
          import re
          existing = Path('existing-notes.md').read_text()
          metadata = Path('notes.md').read_text()
          existing = re.sub(r'^The upstream master extension was built against Ghidra commit `[^`]+`\.\n?', '', existing)
          Path('notes.md').write_text(metadata + existing)
          PYNOTES
            # Hide an existing release before changing any assets. Failures leave it in draft.
            gh release edit "$RELEASE_TAG" --draft=true --notes-file notes.md
          else
            printf '\n' >> notes.md
            gh api --method POST "repos/$GH_REPO/releases/generate-notes" \
              -f tag_name="$RELEASE_TAG" --jq .body >> notes.md
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG" \
              --notes-file notes.md
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
